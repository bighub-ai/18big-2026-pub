version: 2

models:
  - name: dim_customer
    description: "Customer dimension with order metrics."
    columns:
      - name: customer_id
        description: "Primary key."
        tests:
          - unique
          - not_null

  - name: fct_orders
    description: "Order fact table."
    columns:
      - name: order_id
        tests:
          - not_null
      - name: order_amount
        tests:
          - not_null
